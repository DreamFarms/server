#github repo Actions 이름
name: CI/CD

on:
  workflow_dispatch: # 수동 실행 트리거
  # push:
  #   branches: ["develop"]
  # pull_request:
  #   branches: ["develop"]

permissions: write-all

jobs:
  build-and-deploy:
    # ubuntu 최신버전에서 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}
          submodules: true
          # 자바 버전설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Add permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build -x test

      - name: Docker build & push to docker repo
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile -t ${{ secrets.DOCKER_REPO }}/esg-cafe .
          docker push ${{ secrets.DOCKER_REPO }}/esg-cafe

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        id: deploy
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PEMKEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd /home/ubuntu/esg-cafe
            # 새 이미지 받아서 app 컨테이너만 교체 (mysql/redis/caddy 는 그대로 유지)
            sudo docker compose pull app
            sudo docker compose up -d
            sudo docker image prune -f
            sudo docker compose ps
            sudo docker compose logs --tail=50 app
